# Experimental Agent Teams profile layer. Apply after dsh-base so these replacements
# keep direct delegation and coordination on the Team tools.

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- insert:
    - id: agent-team
      name: '@deepseek-ai/dsh-experimental-agent-team'
      config:
        maxMembers: 8
        maxTasks: 256
        maxMessageBytes: 65536
        disposalTimeoutMs: 5000

    - id: tool-agent-team
      name: '@deepseek-ai/dsh-experimental-tool-agent-team'
      config:
        freshProvider: spawn
        forkProvider: fork

    - id: ui-agent-team
      name: '@deepseek-ai/dsh-experimental-client-ui-agent-team'

    # Presets mount their own subagent controls; suppress those rows so the
    # Team tools registered above are the only delegation surface in every
    # preset composition (Web and terminal).
    - id: agent-team-preset-overlay
      name: '@deepseek-ai/dsh-experimental-agent-team-profile'

    # Terminal surfaces install through ctx.terminalUi; the row is inert in
    # compositions without the terminal (Web) because the seam never exists.
    - id: tui-agent-team
      name: '@deepseek-ai/dsh-experimental-tui-agent-team'
